name: Build and Release Executables

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build CLI and GUI Executables for Different OS
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Step 1: Check out the code from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyqt5 fpdf2
          pip install pyinstaller

      # Step 4: Build CLI Executable
      - name: Build CLI Executable
        run: |
          pyinstaller --onefile --name "ScaleReportCLI" --add-data "fonts:fonts" --icon favicon.ico __mainCLI__.py

      # Step 5: Build GUI Executable
      - name: Build GUI Executable
        run: |
          pyinstaller --onefile --name "ScaleReportGUI" --add-data "fonts:fonts" --icon favicon.ico __mainQtGUI__.py

      # Step 6: Upload artifacts to the job workspace
      - name: Upload CLI Executable
        uses: actions/upload-artifact@v4
        with:
          name: CLI-${{ matrix.os }}
          path: dist/ScaleReportCLI*

      - name: Upload GUI Executable
        uses: actions/upload-artifact@v4
        with:
          name: GUI-${{ matrix.os }}
          path: dist/ScaleReportGUI*

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      # Step 1: Download all artifacts
      - name: Download CLI Artifacts
        uses: actions/download-artifact@v4
        with:
          name: CLI-ubuntu-latest
          path: ./artifacts/ubuntu

      - name: Download GUI Artifacts
        uses: actions/download-artifact@v4
        with:
          name: GUI-ubuntu-latest
          path: ./artifacts/ubuntu

      # Step 2: Create or update a GitHub Release
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0
          release_name: "Release v1.0.0"
          draft: false
          prerelease: false

      # Step 3: Upload assets to the release
      - name: Upload CLI Executable to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/ubuntu/ScaleReportCLI*
          asset_name: ScaleReportCLI-ubuntu
          asset_content_type: application/octet-stream

      - name: Upload GUI Executable to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./artifacts/ubuntu/ScaleReportGUI*
          asset_name: ScaleReportGUI-ubuntu
          asset_content_type: application/octet-stream