name: Build and Release Executables

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build CLI and GUI Executables
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyqt5 fpdf2 pyinstaller

      - name: Build CLI Executable
        run: |
          pyinstaller --onefile --name "ScaleReportCLI" --add-data "fonts:fonts" --icon favicon.ico __mainCLI__.py

      - name: Build GUI Executable
        run: |
          pyinstaller --onefile --name "ScaleReportGUI" --add-data "fonts:fonts" --icon favicon.ico __mainQtGUI__.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: executables-${{ matrix.os }}
          path: dist/*

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Release v1.0.0"
          files: ./artifacts/**/* 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}