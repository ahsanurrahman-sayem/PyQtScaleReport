name: Build Executables

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build CLI and GUI Executables for Different OS
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Step 1: Check out the code from the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Step 4: Build CLI Executable
      - name: Build CLI Executable
        run: |
          pyinstaller --onefile --name "ScaleReportCL --add-data "fonts:fonts" --icon favicon.ico __mainCLI__.py

      # Step 5: Build GUI Executable
      - name: Build GUI Executable
        run: |
          pyinstaller --onefile --name "Scale Report" --add-data "fonts:fonts" --icon favicon.ico __mainQtGUI__.py

      # Step 6: Upload the artifacts (executables)
      - name: Upload CLI Executable
        uses: actions/upload-artifact@v3
        with:
          name: executable-CLI-${{ matrix.os }}
          path: dist/Command Line Tool*

      - name: Upload GUI Executable
        uses: actions/upload-artifact@v3
        with:
          name: executable-GUI-${{ matrix.os }}
          path: dist/ScaleReport*
